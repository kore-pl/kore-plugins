name: 索引条目错误
description: 报告索引条目、版本账本、预设或验签的问题（安全漏洞请勿公开提交，见 SECURITY.md）
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        本仓只维护索引元数据，不代管包；包本身的问题请报到对应 `kore-plugin-<id>` 仓。
        **安全漏洞不要开公开 issue**，请按 [SECURITY.md](SECURITY.md) 私下报告。

  - type: dropdown
    id: issue-kind
    attributes:
      label: 问题类型
      options:
        - 索引条目错误（version / sha256 / size_bytes / download_url）
        - 版本账本不一致（versions.lock.json）
        - 预设引用或开箱标记错误
        - 验签失败 / 签名问题
        - 市场页（market/）问题
        - 校验脚本误报或漏报
    validations:
      required: true

  - type: input
    id: plugin-id
    attributes:
      label: 插件 id 与版本
      description: 例如 `echo@0.1.3`；整仓问题写"不适用"。
      placeholder: "echo@0.1.3"
    validations:
      required: true

  - type: input
    id: index-commit
    attributes:
      label: 索引 commit
      description: 出现问题的 `main` 提交（`git rev-parse --short HEAD`）。
      placeholder: "f586c0e"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望值
      description: 期望的 version / sha256 / size_bytes / download_url 或预设内容。
      render: text
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际值
      description: 索引里的实际字段；贴 `plugins.json` 对应片段即可，不要贴整份文件。
      render: json
    validations:
      required: true

  - type: textarea
    id: check-output
    attributes:
      label: make check 输出
      description: 在仓库根执行 `make check`，粘贴完整输出与退出码。
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错原文
      description: 验签失败、安装拒绝（sha256 不符）等原始报错。**请先脱敏。**
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已搜索现有 issue，确认不是重复报告
          required: true
        - label: 我已确认这是索引元数据问题，而不是插件包本身的问题
          required: true
        - label: 我已对日志脱敏，未包含口令 / token / 私钥
          required: true
