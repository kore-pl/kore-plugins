name: CI

# 2026-11-23 策略：CI 只做兜底，少触发——push main / tag v* / PR / 手动。
# 索引仓只有静态数据与校验脚本：check 跑仓内门禁，oss 校验九件套与占位残留。
#
# 签名分层（方案 A：签名由发布方在权威源 Gitea 执行，私钥不入库、不进任何 GitHub secret）：
#   pull_request         → KORE_INDEX_SKIP_SIG=1 make check：只验 schema / 版本账本 / 预设引用。
#                          贡献者没有私钥，改内容就无法提供有效 .sig；PR 上验签必然红，
#                          会把正常贡献挡在门外。
#   push main / tag      → 全量 make check：含 ed25519 验签，未签 / 错签 / 内容与 .sig 不一致即红。
#                          （workflow_dispatch 也走全量，手动触发通常发生在权威源或镜像 main 上。）
# 本工作流不持有、也不需要任何签名密钥；权限保持只读。
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    name: Index + presets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PR：贡献者无私钥 → 跳过验签，只验 schema / 账本 / 预设（脚本会打印「已跳过」）。
      - name: make check（PR：schema / 账本 / 预设，跳过验签）
        if: "github.event_name == 'pull_request'"
        env:
          KORE_INDEX_SKIP_SIG: "1"
        run: make check

      # main / tag：发布侧全量校验，含 ed25519 验签，fail-closed。
      - name: make check（push main / tag：全量含 ed25519 验签）
        if: "github.event_name != 'pull_request'"
        run: make check

      - name: 索引 JSON 可解析
        run: |
          python3 -c 'import json; json.load(open("index/plugins.json", encoding="utf-8"))'
          python3 -c 'import json; json.load(open("index/versions.lock.json", encoding="utf-8"))'

  oss:
    name: OSS assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 九件套 / LICENSE / 占位残留
        run: |
          set -eu
          files="CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md AGENTS.md \
                 .github/PULL_REQUEST_TEMPLATE.md \
                 .github/ISSUE_TEMPLATE/bug_report.yml \
                 .github/ISSUE_TEMPLATE/feature_request.yml \
                 .github/ISSUE_TEMPLATE/config.yml \
                 .github/workflows/ci.yml"
          for f in $files; do
            [ -f "$f" ] || { echo "[FAIL] 缺 $f"; exit 1; }
          done
          grep -qF 'MIT License' LICENSE || { echo "[FAIL] LICENSE 缺 MIT License"; exit 1; }
          grep -qF 'Permission is hereby granted' LICENSE || { echo "[FAIL] LICENSE 缺 MIT 许可句"; exit 1; }
          grep -qF '<!-- oss:begin -->' README.md || { echo "[FAIL] README 缺 oss:begin"; exit 1; }
          grep -qF '<!-- oss:end -->' README.md || { echo "[FAIL] README 缺 oss:end"; exit 1; }
          stale="$(grep -nF '{{' $files | grep -vF '${{' || true)"
          if [ -n "$stale" ]; then
            echo "[FAIL] 生成文件残留占位符："
            echo "$stale"
            exit 1
          fi
          echo "[OK] 九件套 / LICENSE / 占位符检查通过"
