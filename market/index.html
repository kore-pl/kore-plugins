<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kore 插件市场 · 静态索引</title>
  <style>
    :root { color-scheme: light dark; --fg:#1a1a1a; --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --muted:#666; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e8eaed; --bg:#111317; --card:#1b1e24; --line:#313640; --muted:#9aa0aa; --accent:#7aa2ff; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans CJK SC","Microsoft YaHei",sans-serif; }
    .wrap { max-width:920px; margin:0 auto; padding:24px 16px 48px; }
    h1 { font-size:24px; margin:0 0 4px; }
    .sub { color:var(--muted); margin:0 0 16px; font-size:13px; }
    .offline { background:#eef6ff; color:#1e4fa3; border:1px solid #cfe0ff; padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:20px; }
    @media (prefers-color-scheme: dark) { .offline { background:#12233d; color:#9dc1ff; border-color:#24405f; } }
    .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    #q { flex:1 1 260px; min-width:0; height:44px; padding:0 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font-size:15px; }
    #q:focus { outline:2px solid var(--accent); outline-offset:1px; }
    .count { align-self:center; color:var(--muted); font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
    .title { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
    .name { font-size:16px; font-weight:600; }
    .id { color:var(--muted); font-size:12px; }
    .ver { color:var(--muted); font-size:12px; margin-left:auto; }
    .badge { display:inline-block; font-size:11px; line-height:18px; padding:0 8px; border-radius:9px; margin-top:8px; font-weight:600; }
    .badge.production { background:#e6f4ea; color:#187036; }
    .badge.basic { background:#fef3e0; color:#9a5b00; }
    @media (prefers-color-scheme: dark) {
      .badge.production { background:#12301d; color:#7fd39b; }
      .badge.basic { background:#352a13; color:#f0c274; }
    }
    .desc { color:var(--muted); font-size:13px; margin:8px 0 0; }
    .tags { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
    .tag { font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 7px; }
    .empty { color:var(--muted); padding:32px 0; text-align:center; }
    footer { color:var(--muted); font-size:12px; margin-top:28px; border-top:1px solid var(--line); padding-top:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>kore 插件市场</h1>
    <p class="sub">纯静态索引页 · 数据来源 index/plugins.json（构建期内嵌）</p>
    <div class="offline">本页完全静态，不发起任何网络请求：数据已内嵌在 plugins.js，断网、file:// 双击打开均可用。无账号、无审核、无服务端。</div>
    <div class="bar">
      <input id="q" type="search" placeholder="按 id / 名称 / 场景标签搜索" autocomplete="off" aria-label="搜索插件">
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>没有匹配的插件</div>
    <footer>插件包的安装与验签由 kore 在本地完成；本页只做索引展示，不代表信任背书。</footer>
  </div>

  <script src="plugins.js"></script>
  <script>
  (function () {
    'use strict';
    var data = window.KORE_PLUGINS || [];
    var grid = document.getElementById('grid');
    var empty = document.getElementById('empty');
    var count = document.getElementById('count');
    var q = document.getElementById('q');

    function el(tag, cls, text) {
      var node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function render(list) {
      grid.textContent = '';
      empty.hidden = list.length !== 0;
      count.textContent = '共 ' + list.length + ' 个插件';
      list.forEach(function (p) {
        var card = el('article', 'card');
        var title = el('div', 'title');
        title.appendChild(el('span', 'name', p.name));
        title.appendChild(el('span', 'id', p.id));
        title.appendChild(el('span', 'ver', 'v' + p.version));
        card.appendChild(title);
        card.appendChild(el('span', 'badge ' + p.depth_level,
          p.depth_level === 'production' ? 'production · 生产级' : 'basic · 基础级'));
        card.appendChild(el('p', 'desc', p.description));
        var tags = el('div', 'tags');
        (p.scenario_tags || []).forEach(function (t) { tags.appendChild(el('span', 'tag', t)); });
        card.appendChild(tags);
        grid.appendChild(card);
      });
    }

    function onSearch() {
      var kw = q.value.trim().toLowerCase();
      var list = !kw ? data : data.filter(function (p) {
        var hay = [p.id, p.name].concat(p.scenario_tags || []).join(' ').toLowerCase();
        return hay.indexOf(kw) !== -1;
      });
      render(list);
    }

    q.addEventListener('input', onSearch);
    render(data);
  })();
  </script>
</body>
</html>
